<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="focus">
  <main class="app">
    <header class="topbar">
      <h1 class="brand">Pomodoro Timer- Self help</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="Timer settings" title="Timer settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Mode switcher -->
    <nav class="modes" role="tablist" aria-label="Timer mode">
      <span class="modes-indicator" aria-hidden="true"></span>
      <button class="mode is-active" role="tab" aria-selected="true"  data-mode="focus">Focus</button>
      <button class="mode"           role="tab" aria-selected="false" data-mode="short">Short break</button>
      <button class="mode"           role="tab" aria-selected="false" data-mode="long">Long break</button>
    </nav>

    <!-- Progress ring + digits -->
    <section class="timer" id="timer">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90"/>
        <circle class="ring-progress" id="ring" cx="100" cy="100" r="90"/>
      </svg>
      <div class="readout">
        <div class="time" id="time" role="timer">25:00</div>
        <div class="label" id="label">Focus</div>
      </div>
      <div class="loop-badge" id="loopBadge" aria-live="polite"></div>
    </section>

    <!-- Completed focus rounds in the current cycle of four -->
    <div class="cycle" role="img" aria-label="Focus rounds completed in this cycle">
      <span class="cycle-seg"></span>
      <span class="cycle-seg"></span>
      <span class="cycle-seg"></span>
      <span class="cycle-seg"></span>
    </div>

    <p class="message" id="message" aria-live="polite"></p>

    <div class="controls">
      <button class="btn btn-primary" id="primary">Start</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn btn-loop" id="loop" aria-pressed="false">
        <svg class="loop-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/>
          <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>
        </svg>
        <span id="loopText">Loop</span>
      </button>
    </div>
  </main>

  <!-- Timer settings: user-chosen length of each session, in minutes -->
  <dialog class="dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <form class="dialog-form" id="settingsForm" method="dialog">
      <h2 id="settingsTitle">Timer settings</h2>
      <p class="dialog-hint">Choose how long each session lasts, in minutes.</p>
      <div class="setting-rows">
        <div class="setting-row" data-mode="focus">
          <label for="setFocus">Focus</label>
          <div class="stepper stepper-sm">
            <button type="button" class="step" data-step="-1" aria-label="Decrease focus minutes">−</button>
            <input type="number" id="setFocus" min="1" max="120" inputmode="numeric" required>
            <button type="button" class="step" data-step="1" aria-label="Increase focus minutes">+</button>
          </div>
        </div>
        <div class="setting-row" data-mode="short">
          <label for="setShort">Short break</label>
          <div class="stepper stepper-sm">
            <button type="button" class="step" data-step="-1" aria-label="Decrease short break minutes">−</button>
            <input type="number" id="setShort" min="1" max="60" inputmode="numeric" required>
            <button type="button" class="step" data-step="1" aria-label="Increase short break minutes">+</button>
          </div>
        </div>
        <div class="setting-row" data-mode="long">
          <label for="setLong">Long break</label>
          <div class="stepper stepper-sm">
            <button type="button" class="step" data-step="-1" aria-label="Decrease long break minutes">−</button>
            <input type="number" id="setLong" min="1" max="60" inputmode="numeric" required>
            <button type="button" class="step" data-step="1" aria-label="Increase long break minutes">+</button>
          </div>
        </div>
      </div>
      <button type="button" class="link-btn" id="settingsDefaults">Restore defaults (25 / 5 / 15)</button>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Auto-loop setup: asks how many Focus → Short break → Long break loops to run -->
  <dialog class="dialog" id="loopDialog" aria-labelledby="loopTitle">
    <form class="dialog-form" id="loopForm" method="dialog">
      <h2 id="loopTitle">Auto loop</h2>
      <p class="dialog-hint">Runs Focus → Short break → Long break on its own, one after another, without waiting for you to press Start.</p>
      <label class="dialog-label" for="loopCount">How many loops?</label>
      <div class="stepper">
        <button type="button" class="step" data-step="-1" aria-label="One fewer loop">−</button>
        <input type="number" id="loopCount" min="1" max="12" value="2" inputmode="numeric" required>
        <button type="button" class="step" data-step="1" aria-label="One more loop">+</button>
      </div>
      <p class="loop-total" id="loopTotal"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Start loop</button>
      </div>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
